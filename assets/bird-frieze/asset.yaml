# descriptive: find it and understand it
id: bird-frieze
title: Birds and parrots on a flowering frieze
description: An engraved frieze crowded with birds on a thin ground of grass tufts and small flowers, with leafy branches rising between them. Left to right, a small lizard climbs a stem at the far left, a peacock fans its tail, a second peacock walks right trailing its tail, a crested bird perches, a long-necked waterfowl rears with raised wings, birds hover and hang from branches, a crested hook-beaked bird of prey spreads its wings facing left, and several parrots perch among flowers at the right end. Sepia-brown line work with cream hatching on a transparent background; complete, it does not repeat.
